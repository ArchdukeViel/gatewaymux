version: 2
updates:
  # Cargo workspace dependencies.
  # Patch/minor updates may be grouped; major updates are excluded from
  # the group and MUST be opened as separate, per-dependency pull
  # requests. Security updates are never grouped (group `applies-to`
  # defaults to version-updates), so they remain individually visible.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      cargo-patch-minor:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  # Dashboard npm workspace dependencies.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      dashboard-patch-minor:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  # npm distribution packaging tooling.
  - package-ecosystem: "npm"
    directory: "/packaging/npm"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-distribution-patch-minor:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions workflow dependencies.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions-patch-minor:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
