version: 2
updates:
  # Cargo workspace dependencies
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      cargo-dependencies:
        patterns:
          - "*"

  # Dashboard and control plane npm workspace dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      dashboard-workspace-dependencies:
        patterns:
          - "*"

  # npm distribution packaging tooling
  - package-ecosystem: "npm"
    directory: "/packaging/npm"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-distribution-tooling:
        patterns:
          - "*"

  # GitHub Actions workflow dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
