name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # Weekly on Mondays

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret & Pattern Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan for forbidden patterns
        run: |
          echo "Scanning repository for accidental credential leaks..."
          # Exclude .git and verify no real API keys exist
          ! grep -rnE "ghp_[A-Za-z0-9]{36}|sk-[A-Za-z0-9]{48}" . --exclude-dir=.git

  cargo-deny:
    name: Cargo Deny (Advisories, Bans & Licenses)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run cargo-deny checks
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  # Required aggregation status: the active `main-protection` ruleset
  # requires this single stable check name instead of tracking the
  # individual security job names.
  #
  # Semantics:
  # - A failed or cancelled applicable security job fails the gate.
  # - A legitimately event-skipped job (for example, Dependency Review
  #   on non-pull_request events) does NOT fail the gate; an
  #   event-based skip is expected, while a failure is never masked.
  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    needs: [secret-scan, cargo-deny, dependency-review]
    if: ${{ always() }}
    steps:
      - name: Aggregate security check results
        env:
          SECRET_SCAN: ${{ needs.secret-scan.result }}
          CARGO_DENY: ${{ needs.cargo-deny.result }}
          DEPENDENCY_REVIEW: ${{ needs.dependency-review.result }}
        run: |
          set -euo pipefail
          failed=0
          report() {
            case "$2" in
              success)
                echo "  $1: PASS"
                ;;
              skipped)
                echo "  $1: SKIPPED (not applicable to this event)"
                ;;
              *)
                echo "::error::$1 reported result '$2'; the required Security Gate fails."
                failed=1
                ;;
            esac
          }
          echo "Security Gate prerequisite results:"
          report "Secret & Pattern Scan" "$SECRET_SCAN"
          report "Cargo Deny" "$CARGO_DENY"
          report "Dependency Review" "$DEPENDENCY_REVIEW"
          if [ "$failed" -ne 0 ]; then
            echo "Security Gate: FAILED"
            exit 1
          fi
          echo "Security Gate: every applicable security check passed."
