name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  repo-hygiene:
    name: Repository Hygiene & Architecture
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master / v1
        with:
          toolchain: stable

      - name: Verify repository root hygiene
        run: cargo xtask repo-check

      - name: Verify architectural dependency boundaries
        run: cargo xtask architecture-check

      - name: Verify generated file drift
        run: cargo xtask generate --check

      - name: Verify Compatibility Corpus sanitization
        run: cargo xtask compat

  risk-assessment:
    name: Risk Classification Verification
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master / v1
        with:
          toolchain: stable

      - name: Evaluate change-risk class
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if ($env:BASE_REF) {
            cargo xtask risk-check --base "origin/$env:BASE_REF"
          } else {
            cargo xtask risk-check
          }

  rust-validation:
    name: Rust Check, Clippy & Tests
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master / v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Cargo check workspace
        run: cargo check --workspace

      - name: Cargo clippy workspace
        run: cargo clippy --workspace -- -D warnings

      - name: Run Rust workspace unit and integration tests
        run: cargo test --workspace

  npm-validation:
    name: npm Workspaces Validation
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run npm workspace validation checks
        run: npm run check

      - name: Run npm workspace tests
        run: npm test

  release-check:
    name: Release Readiness & Version Alignment
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master / v1
        with:
          toolchain: stable

      - name: Run release check
        run: cargo xtask release-check
