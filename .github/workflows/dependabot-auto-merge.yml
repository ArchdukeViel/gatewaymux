name: Dependabot Auto-Merge Policy

# Approved policy: patch/minor Dependabot pull requests MAY be squash
# auto-merged, but ONLY after the repository owner (@ArchdukeViel) has
# submitted a valid APPROVED review for the PR's CURRENT head revision
# and every required status check passes. Major updates are never
# auto-merged.
#
# Enforcement model (metadata-only, no untrusted code execution):
# 1. This workflow runs from the BASE branch (`pull_request_target` /
#    `pull_request_review`) and NEVER checks out or executes pull
#    request code, even though it holds write permissions. GitHub
#    Dependabot identity is verified from the GitHub event payload and
#    re-verified through the GitHub API by `dependabot/fetch-metadata`
#    (PR author, first-commit author, and commit signature); it is
#    never inferred from PR title, body, or branch name.
# 2. Update severity comes from GitHub's OFFICIAL Dependabot metadata
#    (`dependabot/fetch-metadata` `update-type` output):
#      - `version-update:semver-patch` -> eligible
#      - `version-update:semver-minor`  -> eligible
#      - `version-update:semver-major`  -> NOT eligible (manual merge)
#      - missing/unavailable metadata   -> fail closed (manual merge)
# 3. Auto-merge is enabled ONLY after a valid owner APPROVED review for
#    the current head revision exists. This workflow never submits
#    approvals of its own. If the PR changes after approval, the stale
#    approval no longer satisfies the required "Owner Approval Gate"
#    status check, so GitHub cannot complete the merge until the
#    current revision is explicitly approved again (the review event
#    then re-evaluates this policy).
# 4. Merging itself is GitHub-native: this workflow only enables
#    auto-merge (`gh pr merge --auto --squash`); GitHub performs the
#    squash merge only when the full ruleset is satisfied.

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    name: Enable Post-Approval Auto-Merge
    runs-on: ubuntu-latest
    # Trusted identity from GitHub event metadata: only Dependabot PRs
    # are ever considered by this policy. fetch-metadata re-verifies the
    # author, the first commit author, and the commit signature via the
    # GitHub API before producing any metadata.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Verify Dependabot identity from GitHub event metadata
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          AUTHOR_LOWER=$(echo "$PR_AUTHOR" | tr '[:upper:]' '[:lower:]')
          if [ "$AUTHOR_LOWER" != "dependabot[bot]" ]; then
            echo "::error::PR author '$PR_AUTHOR' is not GitHub Dependabot; identity verification failed."
            exit 1
          fi
          echo "Trusted GitHub Dependabot PR #$PR_NUMBER detected (identity from GitHub event metadata, never from PR text)."

      - name: Fetch official Dependabot metadata
        id: dependabot-metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
      # The action itself fails closed when the PR is not authored by
      # Dependabot, contains non-Dependabot commits, has an unverified
      # commit signature, or exposes no parseable update metadata.

      - name: Verify update type is patch or minor
        id: update-type
        env:
          UPDATE_TYPE: ${{ steps.dependabot-metadata.outputs.update-type }}
        run: |
          set -euo pipefail
          case "$UPDATE_TYPE" in
            version-update:semver-patch|version-update:semver-minor)
              echo "Dependabot update type '$UPDATE_TYPE' is eligible for post-approval auto-merge."
              echo "eligible=true" >> "$GITHUB_OUTPUT"
              ;;
            version-update:semver-major)
              echo "::notice::Auto-merge NOT enabled: update type '$UPDATE_TYPE' is a major-version upgrade. Major updates always require manual owner review and merge."
              echo "eligible=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Auto-merge NOT enabled: Dependabot update type could not be proven patch/minor (reported: '${UPDATE_TYPE:-unavailable}'). The PR fails closed to manual owner review and merge."
              exit 1
              ;;
          esac

      - name: Verify owner approval for the current head revision
        id: owner-approval
        if: steps.update-type.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          LATEST_STATE=$(gh api "repos/$REPO/pulls/$PR_NUMBER/reviews" --jq '[.[] | select((.user.login | ascii_downcase) == "archdukeviel")] | last | .state // "none"')
          LATEST_COMMIT_ID=$(gh api "repos/$REPO/pulls/$PR_NUMBER/reviews" --jq '[.[] | select((.user.login | ascii_downcase) == "archdukeviel")] | last | .commit_id // "none"')
          if [ "$LATEST_STATE" = "APPROVED" ] && [ "$LATEST_COMMIT_ID" = "$PR_HEAD_SHA" ]; then
            echo "Valid APPROVED review from @ArchdukeViel exists for the current head revision ($PR_HEAD_SHA)."
            echo "owner-approved=true" >> "$GITHUB_OUTPUT"
          else
            echo "No valid owner approval for the current head revision yet (latest owner review state: ${LATEST_STATE:-none}, commit: ${LATEST_COMMIT_ID:-none}, current head: $PR_HEAD_SHA)."
            echo "Auto-merge will not be enabled until @ArchdukeViel explicitly approves the current PR revision."
            echo "owner-approved=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Enable GitHub-native squash auto-merge
        if: steps.owner-approval.outputs.owner-approved == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          if gh pr merge --auto --squash "$PR_URL"; then
            echo "Auto-merge (squash) enabled. GitHub merges only after every required check passes, including the required 'Owner Approval Gate' for the current head SHA."
          else
            echo "::error::Failed to enable auto-merge (for example, an unresolvable conflict or a changed repository setting). Nothing was merged or approved; the PR remains a manual merge."
            exit 1
          fi
