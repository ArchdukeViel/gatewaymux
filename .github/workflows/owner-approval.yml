name: Owner Approval Gate

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  pull-requests: read
  contents: read

jobs:
  owner-approval:
    name: Owner Approval Gate
    runs-on: ubuntu-latest
    steps:
      - name: Verify Owner Approval
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          echo "PR Author: $PR_AUTHOR"
          AUTHOR_LOWER=$(echo "$PR_AUTHOR" | tr '[:upper:]' '[:lower:]')
          if [ "$AUTHOR_LOWER" = "archdukeviel" ]; then
            echo "Author is repository owner (@ArchdukeViel). Approval gate passed automatically."
            exit 0
          fi

          echo "External contribution detected. Checking for owner approval from @ArchdukeViel..."
          LATEST_STATE=$(gh api "repos/$REPO/pulls/$PR_NUMBER/reviews" --jq '[.[] | select((.user.login | ascii_downcase) == "archdukeviel")] | last | .state')

          if [ "$LATEST_STATE" = "APPROVED" ]; then
            echo "Found valid APPROVED review from @ArchdukeViel. Approval gate passed."
            exit 0
          else
            echo "::error::Pull requests from external contributors require explicit approval from @ArchdukeViel. Current owner review state: ${LATEST_STATE:-none}"
            exit 1
          fi
