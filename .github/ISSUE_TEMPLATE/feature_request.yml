name: Feature Request
description: Propose a new capability or architectural improvement for GatewayMux
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a specific limitation or problem?
    validations:
      required: true
  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution / Behavior
      description: Describe what you would like GatewayMux to do.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative designs or workarounds considered.
    validations:
      required: false
  - type: dropdown
    id: prd_impact
    attributes:
      label: PRD Impact
      options:
        - Within existing PRD v1.0.0 scope
        - Extends PRD v1.0.0 (requires PRD amendment)
        - Future consideration (post-v1.0.0)
    validations:
      required: true
